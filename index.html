<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' file: data:">
  <title>桌面时钟</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="clock" aria-label="当前时间" data-theme="auto" data-font="system">
    <div id="bg"></div>
    <div id="wrap">
      <div class="line">
        <time id="time">--:--:--</time>
        <span id="ampm"></span>
      </div>
      <div id="date" class="hidden"></div>
    </div>
  </main>
  <script src="clock.js"></script>
</body>
</html>
